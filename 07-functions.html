    <h1>What is a Function?</h1>
    <p>A function is a block of code that performs a specific task. It can take inputs, called parameters, and can return an output. Functions help to organize code, make it reusable, and improve readability.</p>

    <script>
        // Example function
        function greet(name) {
            return "Hello, " + name + "!";
        }

        // Call the function
